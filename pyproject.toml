[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ecom-experimentation"
version = "0.1.0"
description = "E-commerce experimentation and propensity platform: Spark/Hive ingestion, SQL analytics, inferential stats, ML propensity models, A/B testing, MongoDB serving and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pyspark>=3.5.3,<3.6",
    "duckdb>=1.1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.1",
    "pyarrow>=16",
    "pyyaml>=6",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5,<1.7",
    "xgboost>=2.1,<3",
    "optuna>=4.0",
    "shap>=0.46",
    "h2o>=3.46",
    "mlflow>=2.17,<3",
    "sqlalchemy>=2.0,<2.1",  # mlflow 2.x imports pool classes removed in SQLAlchemy 2.1
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "kaleido==0.2.1",
    "pymongo>=4.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
    "requests>=2.32",
    "tabulate>=0.9",
    "nbformat>=5.10",
    "jinja2>=3.1",
    "psutil>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx2>=2.16",  # transport for starlette/fastapi TestClient
    "mongomock>=4.2",
    "ruff>=0.7",
    "pre-commit>=4",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "kaggle>=1.6",
]

[project.scripts]
ecom = "ecom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "mlruns", ".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ecom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: tests that start a local SparkSession (needs Java 17)",
    "slow: longer-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
    "ignore::FutureWarning",
]
